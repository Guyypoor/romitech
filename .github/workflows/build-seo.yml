name: בניית עמודי מוצר ופיד לגוגל
# כל שינוי בקטלוג (products.json) או בהגדרות (index.html) בונה מחדש את /p /c /m, sitemap.xml ו-feed.xml
on:
  push:
    branches: [main]
    paths: ['products.json', 'index.html', 'tools/build_seo.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency: build-seo
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 tools/build_seo.py
      - name: commit
        run: |
          git config user.name "romitech-bot"
          git config user.email "romitech-bot@users.noreply.github.com"
          git add -A p c m sitemap.xml feed.xml
          git diff --cached --quiet || (git commit -m "עדכון אוטומטי: עמודי מוצר, sitemap ופיד" && git push)
